[project]
name = "nonebot_plugin_nowtime"
version = "0.3.0"
description = "Nonebot2 plugin for telling the time per hour"
authors = [{ name = "Cvandia" }]
license = "MIT"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
dependencies = [
    "nonebot2>=2.2.0",
    "httpx>=0.19.0",
    "anyio>=4.14.2",
    "python-dotenv>=1.2.2",
    "nonebot-plugin-alconna>=0.55.0",
    "nonebot-plugin-localstore>=0.7.4",
    "nonebot-plugin-uninfo>=0.7.0",
    "nonebot-plugin-apscheduler>=0.1.3",
    "pydantic>=1.10.2",
]

[project.urls]
Homepage = "https://github.com/Cvandia/nonebot_plugin_nowtime"
Repository = "https://github.com/Cvandia/nonebot_plugin_nowtime"

[dependency-groups]
dev = ["pre-commit>=4.3.0", "ruff==0.17.0", "nonebot-adapter-console>=0.6.0"]

[tool.uv.build-backend]
module-name = "nonebot_plugin_nowtime"
module-root = ""

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"
